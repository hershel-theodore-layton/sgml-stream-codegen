services:
  hhvm:
    container_name: theodore-sgml-stream-codegen-container
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - type: bind
        source: .
        target: /mnt/project
      # build/ symlinks resolve to these sibling checkouts.
      - type: bind
        source: ../html-stream-namespaced
        target: /mnt/html-stream-namespaced
        bind:
          create_host_path: false
      - type: bind
        source: ../html-stream-non-namespaced
        target: /mnt/html-stream-non-namespaced
        bind:
          create_host_path: false
      - type: bind
        source: ../svg-stream-namespaced
        target: /mnt/svg-stream-namespaced
        bind:
          create_host_path: false
    ports:
      - 48555:10641
